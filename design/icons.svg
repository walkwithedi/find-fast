<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- 秒搜文件图标集：24×24 网格，线性风格，stroke 1.8，currentColor。
       用法：<svg class="i" width="16" height="16"><use href="#i-search"/></svg>
       Web 端用 <use href="#i-xxx">，GTK 端见 icons.md 的映射表。 -->

  <symbol id="i-search" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.6 15.6 21 21"/>
    </g>
  </symbol>

  <!-- —— 类型图标 —— -->
  <symbol id="i-folder" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l1.7 2H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H5.5A2.5 2.5 0 0 1 3 16.5z"/>
    </g>
  </symbol>
  <symbol id="i-doc" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/><path d="M9 13h6M9 17h6"/>
    </g>
  </symbol>
  <symbol id="i-image" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
      <circle cx="9" cy="10.5" r="1.6"/>
      <path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/>
    </g>
  </symbol>
  <symbol id="i-archive" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M5 4h14v16H5z"/><path d="M10 4v6M14 4v4M12 10v3"/>
    </g>
  </symbol>
  <symbol id="i-code" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 8-4 4 4 4M15 8l4 4-4 4"/>
    </g>
  </symbol>
  <symbol id="i-audio" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M5 15V9h3l4-3.5v13L8 15z"/><path d="M16 9.5a4 4 0 0 1 0 5"/>
    </g>
  </symbol>
  <symbol id="i-video" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 11 5-3v8l-5-3z"/>
    </g>
  </symbol>
  <symbol id="i-file" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/>
    </g>
  </symbol>

  <!-- —— 操作图标 —— -->
  <symbol id="i-open" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M14 4h6v6"/><path d="M20 4 11 13"/>
    </g>
  </symbol>
  <symbol id="i-locate" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l1.7 2H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H5.5A2.5 2.5 0 0 1 3 16.5z"/>
    </g>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="9" y="9" width="11" height="11" rx="2"/>
      <path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5A1.5 1.5 0 0 0 5.5 15"/>
    </g>
  </symbol>
  <symbol id="i-ban" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9">
      <circle cx="12" cy="12" r="8.5"/><path d="m6.5 17.5 11-11"/>
    </g>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>
    </g>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 12a2 2 0 1 1 0 4z"/>
    </g>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>
    </g>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
      <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
    </g>
  </symbol>
  <symbol id="i-sort" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M7 4v16M7 20l-3-3M17 20V4M17 4l3 3"/>
    </g>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="m6 9 6 6 6-6"/>
    </g>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6 6 18"/>
    </g>
  </symbol>
  <symbol id="i-more" viewBox="0 0 24 24">
    <g fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>
  </symbol>
  <symbol id="i-fold" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M4 9h16M4 15h9"/>
    </g>
  </symbol>
  <symbol id="i-help" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.9.8c0 1.6-2.5 1.9-2.5 3.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/>
    </g>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7"/>
    </g>
  </symbol>
</svg>
