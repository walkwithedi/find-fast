<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秒搜文件</title>
<script>
  // the theme before the first paint: the one chosen here last time, else the system's
  (function () {
    var t = null;
    try { t = localStorage.getItem('find-fast.theme'); } catch (e) { /* none */ }
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* ---- design tokens: the only source of colours, sizes and timings ---- */
  :root {
    --bg:#e9edf1; --surface:#ffffff; --surface-2:#f7f9fa; --surface-3:#eef1f4;
    --hover:#f4f7fa; --sel:#eff4ff; --sel-line:#2f55d4;
    --ink:#14181d; --ink-2:#4b5563; --ink-3:#66717e;
    --line:#e5e9ed; --line-2:#d3dae1;
    --accent:#2f55d4; --accent-solid:#2f55d4; --on-accent:#ffffff; --accent-ink:#22409e; --accent-soft:#ecf0fc;
    --ok:#0b6b4f; --ok-soft:#e7f4ee; --warn:#8a5a00; --bad:#b3261e; --info:#22409e;
    --mark-bg:#ffe9a8; --mark-fg:inherit;
    --ico-folder:#9a6f16;
    --scrim:rgba(12,16,22,.42);
    --fs-micro:11px; --fs-meta:11.5px; --fs-label:12.5px; --fs-body:13px; --fs-title:14px; --fs-h:15px; --fs-field:15.5px;
    --lh-tight:1.3; --lh:1.45; --lh-loose:1.7;
    --r-xs:4px; --r-sm:6px; --r:8px; --r-md:10px; --r-lg:12px;
    --shadow-1:0 1px 2px rgba(17,24,39,.06);
    --shadow-2:0 12px 32px rgba(17,24,39,.14), 0 2px 8px rgba(17,24,39,.06);
    --ease:cubic-bezier(.2,.7,.3,1); --t-fast:100ms; --t:140ms; --t-slow:180ms;
    --appbar-h:30px; --field-h:44px; --chip-h:28px; --status-h:28px; --row-h:48px; --preview-w:340px; --gutter:14px;
    --font:"Noto Sans CJK SC","WenQuanYi Micro Hei","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"Noto Sans Mono CJK SC","DejaVu Sans Mono",monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0a0c0f; --surface:#14181d; --surface-2:#191e24; --surface-3:#1f252c;
      --hover:#1d232a; --sel:#1b2436; --sel-line:#8aa2ff;
      --ink:#e8edf2; --ink-2:#9aa6b3; --ink-3:#7f8a97;
      --line:#252b32; --line-2:#333b44;
      --accent:#8aa2ff; --accent-solid:#4a67e8; --on-accent:#ffffff; --accent-ink:#b9c6ff; --accent-soft:#1c2434;
      --ok:#63d3a3; --ok-soft:#12241d; --warn:#e0b25c; --bad:#ff8f86; --info:#b9c6ff;
      --mark-bg:rgba(255,201,80,.18); --mark-fg:#ffd98a;
      --ico-folder:#d9a94a; --scrim:rgba(0,0,0,.55);
      --shadow-2:0 16px 40px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0a0c0f; --surface:#14181d; --surface-2:#191e24; --surface-3:#1f252c;
    --hover:#1d232a; --sel:#1b2436; --sel-line:#8aa2ff;
    --ink:#e8edf2; --ink-2:#9aa6b3; --ink-3:#7f8a97;
    --line:#252b32; --line-2:#333b44;
    --accent:#8aa2ff; --accent-solid:#4a67e8; --on-accent:#ffffff; --accent-ink:#b9c6ff; --accent-soft:#1c2434;
    --ok:#63d3a3; --ok-soft:#12241d; --warn:#e0b25c; --bad:#ff8f86; --info:#b9c6ff;
    --mark-bg:rgba(255,201,80,.18); --mark-fg:#ffd98a;
    --ico-folder:#d9a94a; --scrim:rgba(0,0,0,.55);
    --shadow-2:0 16px 40px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --t-fast:1ms; --t:1ms; --t-slow:1ms; }
    *, *::before, *::after { animation-duration:1ms !important; animation-iteration-count:1 !important;
                             transition-duration:1ms !important; }
  }
  /* the one focus ring */
  :where(button, [role="option"], [role="listbox"], [role="tab"], input, select, a, label.drop, summary):focus-visible {
    outline:2px solid var(--accent); outline-offset:1px;
  }

  /* ---- shell ---- */
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:var(--fs-title)/var(--lh) var(--font); overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
  button:disabled { opacity:.45; cursor:default; }
  kbd { font:var(--fs-micro)/1 var(--font); padding:3px 5px; min-width:18px; display:inline-block; text-align:center;
        border:1px solid var(--line-2); border-bottom-width:2px; border-radius:5px; background:var(--surface);
        color:var(--ink-2); box-shadow:var(--shadow-1); }
  code { font-family:var(--mono); font-size:12px; }
  svg.i { flex:none; display:block; }
  .vh { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0);
        white-space:nowrap; border:0; }
  .shell { height:100vh; height:100dvh; display:flex; flex-direction:column; background:var(--surface); min-width:0; }
  .titlebar, .searchbar, .filterbar, .statusbar { flex:none; }

  .titlebar { display:flex; align-items:center; gap:8px; height:var(--appbar-h); padding:0 12px; background:var(--surface-2);
              border-bottom:1px solid var(--line); user-select:none; min-width:0; }
  .tb-mark { display:flex; align-items:center; gap:7px; font-size:var(--fs-label); color:var(--ink-2); min-width:0; white-space:nowrap; }
  .tb-mark svg { color:var(--accent); }
  .tb-mark h1 { font:inherit; margin:0; }
  .tb-ver { color:var(--ink-3); font-size:var(--fs-meta); }
  .tb-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .tb-btn { width:24px; height:24px; display:grid; place-items:center; border-radius:var(--r-sm); color:var(--ink-3); }
  .tb-btn:hover { background:var(--surface-3); color:var(--ink); }
  .tb-quit { height:24px; padding:0 8px; border-radius:var(--r-sm); font-size:var(--fs-label); color:var(--ink-2);
             border:1px solid var(--line-2); background:var(--surface); }
  .tb-quit:hover { background:var(--surface-3); color:var(--ink); }

  .searchbar { display:flex; align-items:center; gap:10px; padding:11px var(--gutter) 10px; position:relative; }
  .field { flex:1; min-width:0; display:flex; align-items:center; gap:9px; height:var(--field-h); padding:0 10px 0 12px;
           background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-lg);
           transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease); }
  .field:hover { border-color:var(--ink-3); }
  .field:focus-within { background:var(--surface); border-color:var(--accent);
                        box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .field.bad { border-color:var(--bad); }
  .field-ico { color:var(--ink-3); display:flex; }
  .field:focus-within .field-ico { color:var(--accent); }
  #q { flex:1; min-width:0; height:100%; border:0; background:none; outline:none; font:var(--fs-field) var(--font); color:var(--ink); }
  #q::placeholder { color:var(--ink-3); }
  #q::-webkit-search-cancel-button { display:none; }
  .kbd-hint { display:flex; align-items:center; gap:3px; color:var(--ink-3); font-size:var(--fs-meta); white-space:nowrap; }
  .field.has-text .kbd-hint { display:none; }
  .clear { width:26px; height:26px; display:none; place-items:center; border-radius:var(--r-sm); color:var(--ink-3); }
  .clear:hover { background:var(--surface-3); color:var(--ink); }
  .field.has-text .clear { display:grid; }
  .icon-btn { width:34px; height:34px; display:grid; place-items:center; border-radius:var(--r); color:var(--ink-2); flex:none; }
  .icon-btn:hover { background:var(--surface-3); color:var(--ink); }
  .fold-state { display:none; font-size:var(--fs-meta); color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .progress { position:absolute; left:0; right:0; bottom:-1px; height:2px; overflow:hidden; opacity:0;
              transition:opacity var(--t-slow); pointer-events:none; }
  .progress.on { opacity:1; }
  .progress i { display:block; height:100%; width:30%; background:var(--accent); animation:sweep 1.2s linear infinite; }
  @keyframes sweep { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  .qerror { position:absolute; left:var(--gutter); right:var(--gutter); top:calc(100% - 9px); z-index:5; margin:0;
            padding:3px 12px; font-size:var(--fs-label); color:var(--bad); background:var(--surface);
            border:1px solid var(--bad); border-top:0; border-radius:0 0 var(--r) var(--r); overflow-wrap:anywhere;
            pointer-events:none; }
  .qerror[hidden] { display:none; }

  /* ---- filter bar ---- */
  .filterbar { display:flex; align-items:center; gap:6px; padding:0 var(--gutter) 10px; min-width:0; }
  .filterbar[hidden] { display:none; }
  .chips { display:flex; align-items:center; gap:6px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:var(--chip-h); padding:0 10px; border:1px solid var(--line);
          border-radius:var(--r-sm); background:var(--surface); color:var(--ink-2); font-size:var(--fs-label); white-space:nowrap;
          flex:none; transition:background var(--t) var(--ease), border-color var(--t) var(--ease); }
  .chip:hover { background:var(--surface-2); border-color:var(--line-2); color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 40%, transparent);
                               color:var(--accent-ink); font-weight:500; }
  .chip .n { font-size:var(--fs-meta); color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"] .n { color:var(--accent-ink); }
  .chip[aria-disabled="true"] { opacity:.45; pointer-events:none; }
  .chip.sk { width:64px; pointer-events:none; }
  .chip .x { display:inline-flex; opacity:.55; margin-right:-3px; }
  .chip:hover .x { opacity:1; }
  .fb-sep { width:1px; height:18px; background:var(--line); margin:0 4px; flex:none; }
  .fb-right { display:flex; gap:6px; flex:none; padding-left:10px; background:var(--surface); }
  .fb-right.over { box-shadow:-12px 0 10px -8px color-mix(in srgb, var(--ink) 12%, transparent); }
  .sortbtn { display:inline-flex; align-items:center; gap:6px; height:var(--chip-h); padding:0 9px; border:1px solid transparent;
             border-radius:var(--r-sm); color:var(--ink-2); font-size:var(--fs-label); white-space:nowrap; }
  .sortbtn:hover { background:var(--surface-2); border-color:var(--line); color:var(--ink); }

  /* ---- results and details ---- */
  .stage { display:grid; grid-template-columns:minmax(0,1fr) var(--preview-w); flex:1 1 auto; min-height:0; }
  .listwrap { position:relative; min-height:0; min-width:0; overflow-y:auto; overflow-x:hidden; border-top:1px solid var(--line);
              background:var(--surface); scrollbar-gutter:stable; }
  .listwrap::-webkit-scrollbar { width:11px; }
  .listwrap::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:99px; border:3px solid var(--surface); background-clip:padding-box; }
  .listwrap::-webkit-scrollbar-thumb:hover { background:var(--ink-3); background-clip:padding-box; }
  #rows { padding:6px 0 0; outline:none; }
  #rows:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .row { display:grid; grid-template-columns:20px minmax(0,1fr) 116px; align-items:center; gap:11px; min-height:var(--row-h);
         padding:0 12px 0 15px; position:relative; cursor:default; transition:background var(--t-fast) var(--ease); }
  .row::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0;
                 background:var(--sel-line); opacity:0; transition:opacity var(--t) var(--ease); }
  .row:hover { background:var(--hover); }
  .row[aria-selected="true"] { background:var(--sel); }
  .row[aria-selected="true"]::before { opacity:1; }
  .row .ico { color:var(--ink-3); display:flex; justify-self:center; }
  .row[data-kind="folder"] .ico { color:var(--ico-folder); }
  .row[aria-selected="true"] .ico { color:var(--accent); }
  .row[aria-selected="true"][data-kind="folder"] .ico { color:var(--ico-folder); }
  .row .body { min-width:0; display:flex; flex-direction:column; gap:2px; padding:5px 0; }
  .line1 { display:flex; align-items:center; gap:7px; min-width:0; }
  .nm { font-size:var(--fs-title); font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        line-height:19px; }
  .row[aria-selected="true"] .nm { color:var(--accent-ink); }
  .pth { font-size:var(--fs-label); color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:17px; }
  .row[aria-selected="true"] .pth { color:var(--ink-2); }
  mark { background:var(--mark-bg); color:var(--mark-fg); border-radius:2px; padding:0; }
  .tag { flex:none; font-size:var(--fs-micro); line-height:1.5; padding:0 5px; border-radius:var(--r-xs); border:1px solid var(--line-2);
         color:var(--ink-3); white-space:nowrap; }
  .tag.new { background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 30%, transparent); color:var(--accent-ink); }
  .meta { display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-variant-numeric:tabular-nums; text-align:right;
          align-self:center; min-width:0; }
  .sz { font-size:var(--fs-label); color:var(--ink-2); white-space:nowrap; }
  .tm { font-size:var(--fs-meta); color:var(--ink-3); white-space:nowrap; }
  .row[aria-selected="true"] .tm { color:var(--ink-2); }
  .end-note { padding:16px 15px 24px; text-align:center; font-size:var(--fs-meta); color:var(--ink-3); }
  .end-note[hidden] { display:none; }

  .empty { position:absolute; inset:0; display:grid; justify-items:center; align-content:start; padding:11vh 24px 24px;
           background:var(--surface); }
  .empty[hidden] { display:none; }
  .empty-in { text-align:center; max-width:460px; }
  .empty-ico { width:52px; height:52px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line);
               display:grid; place-items:center; margin:0 auto 14px; color:var(--ink-3); }
  .empty h2 { margin:0 0 6px; font-size:var(--fs-h); font-weight:600; overflow-wrap:anywhere; }
  .empty p { margin:0 0 14px; color:var(--ink-2); font-size:var(--fs-body); line-height:var(--lh-loose); }
  .eg { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .eg button { font-size:var(--fs-label); padding:5px 9px; border:1px solid var(--line); border-radius:var(--r-sm);
               background:var(--surface); color:var(--ink-2); }
  .eg button:hover { border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .eg code { font-size:var(--fs-label); }
  .skel { position:absolute; inset:0; padding:6px 0; background:var(--surface); }
  .skel[hidden] { display:none; }
  .sk-row { display:flex; gap:11px; align-items:center; height:var(--row-h); padding:0 15px; }
  .sk { background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
        background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:var(--r-xs); }
  .sk-lines { flex:1; display:flex; flex-direction:column; gap:6px; }
  @keyframes shimmer { 0% { background-position:100% 0; } 100% { background-position:0 0; } }

  .preview { border-left:1px solid var(--line); border-top:1px solid var(--line); background:var(--surface-2);
             padding:16px 16px 14px; overflow:auto; min-height:0; min-width:0; }
  .preview [hidden] { display:none !important; }
  .pv-head { display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
  .pv-ico { width:46px; height:46px; border-radius:var(--r-md); display:grid; place-items:center; flex:none; background:var(--surface);
            border:1px solid var(--line); color:var(--ink-2); }
  .pv-ico[data-kind="folder"] { color:var(--ico-folder); }
  .pv-t { min-width:0; padding-top:2px; }
  .pv-name { margin:0; font-size:var(--fs-title); font-weight:600; line-height:1.35; word-break:break-word;
             display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .pv-kind { font-size:var(--fs-label); color:var(--ink-3); margin-top:3px; }
  .pv-path { display:flex; align-items:flex-start; gap:6px; font-size:var(--fs-label); color:var(--ink-2); background:var(--surface);
             border:1px solid var(--line); border-radius:var(--r-sm); padding:7px 8px; margin-bottom:14px; line-height:1.5; }
  .pv-path span { flex:1; min-width:0; word-break:break-all; max-height:6em; overflow:auto; user-select:text; }
  .pv-path button { flex:none; width:22px; height:22px; display:grid; place-items:center; border-radius:var(--r-xs); color:var(--ink-3); }
  .pv-path button:hover { background:var(--surface-3); color:var(--ink); }
  .pv-grid { display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:var(--fs-label); margin:0 0 16px; }
  .pv-grid dt { color:var(--ink-3); }
  .pv-grid dd { margin:0; color:var(--ink-2); font-variant-numeric:tabular-nums; word-break:break-word; }
  .pv-actions { display:flex; flex-direction:column; gap:7px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:34px; padding:0 12px;
         border:1px solid var(--line-2); border-radius:var(--r); background:var(--surface); font-size:var(--fs-body); color:var(--ink); }
  .btn:hover { background:var(--surface-3); }
  .btn.primary { background:var(--accent-solid); border-color:var(--accent-solid); color:var(--on-accent); font-weight:500; }
  .btn.primary:hover { filter:brightness(.92); }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .btn-row .btn { justify-content:flex-start; font-size:var(--fs-label); padding:0 10px; gap:6px; color:var(--ink-2); }
  .pv-hint { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:var(--fs-meta); color:var(--ink-3);
             display:grid; grid-template-columns:1fr 1fr; gap:9px 6px; }
  .pv-hint div { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .pv-hint kbd { font-size:10px; padding:2px 4px; min-width:0; }
  .ix-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0;
            border-bottom:1px solid var(--line); font-size:var(--fs-label); color:var(--ink-2); }
  .ix-row b { font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; text-align:right; }
  .ix-tip { margin:14px 0 0; font-size:var(--fs-meta); color:var(--ink-3); line-height:var(--lh-loose); }

  /* ---- status bar: the only place that counts results ---- */
  .statusbar { display:flex; align-items:center; gap:14px; height:var(--status-h); padding:0 var(--gutter); border-top:1px solid var(--line);
               background:var(--surface-2); font-size:var(--fs-meta); color:var(--ink-3); font-variant-numeric:tabular-nums;
               white-space:nowrap; min-width:0; }
  .st-count { color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; }
  .st-count b { font-weight:600; color:var(--ink); }
  #count.ok { color:var(--ok); } #count.warn { color:var(--warn); } #count.bad { color:var(--bad); } #count.info { color:var(--info); }
  .st-hints { margin:0 auto; display:flex; gap:12px; align-items:center; overflow:hidden; }
  .st-hints div { display:flex; align-items:center; gap:4px; }
  .st-hints kbd { padding:1.5px 4px; font-size:10.5px; min-width:16px; border-bottom-width:1px; }
  .st-right { display:flex; align-items:center; gap:6px; margin-left:auto; min-width:0; overflow:hidden; flex:0 1 auto; }
  .st-right span { overflow:hidden; text-overflow:ellipsis; }
  .st-hints + .st-right { margin-left:0; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); flex:none; }
  .dot.warn { background:var(--warn); box-shadow:none; } .dot.bad { background:var(--bad); box-shadow:none; }
  .st-rule { color:var(--ink-3); }

  /* ---- menus, toast, banner ---- */
  .menu { position:fixed; z-index:60; min-width:196px; max-width:calc(100vw - 16px); padding:5px; border-radius:var(--r-md);
          background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-2); font-size:var(--fs-body); }
  .menu[hidden] { display:none; }
  .menu button { display:flex; width:100%; align-items:center; gap:8px; height:30px; padding:0 8px; border-radius:var(--r-sm);
                 color:var(--ink); text-align:left; white-space:nowrap; }
  .menu button[hidden] { display:none; }
  .menu button .mi { display:flex; color:var(--ink-3); flex:none; width:14px; }
  .menu button .mk { margin-left:auto; padding-left:16px; font-size:var(--fs-micro); color:var(--ink-3); }
  .menu button:hover, .menu button:focus-visible { background:var(--accent-soft); color:var(--accent-ink); outline:none; }
  .menu button:hover .mi, .menu button:focus-visible .mi { color:var(--accent); }
  .menu button[aria-checked="true"] { font-weight:500; }
  .menu button[aria-checked="true"] .mi { color:var(--accent); }
  .menu button:disabled { opacity:.45; }
  .menu hr { border:0; border-top:1px solid var(--line); margin:4px; }
  #toast { position:fixed; left:50%; bottom:calc(var(--status-h) + 18px); transform:translate(-50%, 10px); display:block;
           padding:7px 12px; border-radius:var(--r); background:var(--ink); color:var(--surface); font-size:var(--fs-label);
           opacity:0; pointer-events:none; transition:opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
           z-index:80; box-shadow:var(--shadow-2); max-width:min(560px, 90vw); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%, 0); }
  #closed { display:none; position:fixed; left:12px; right:12px; top:40px; z-index:90; background:var(--surface);
            border:1px solid var(--bad); color:var(--bad); border-radius:var(--r); padding:12px; }

  /* ---- dialogs ---- */
  dialog { border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface); color:var(--ink); padding:0;
           box-shadow:var(--shadow-2); width:min(720px, calc(100vw - 24px)); max-height:82vh; }
  dialog[open] { display:flex; flex-direction:column; }
  dialog::backdrop { background:var(--scrim); }
  .dlg-head { display:flex; align-items:center; padding:14px 16px 12px; border-bottom:1px solid var(--line); flex:none; }
  .dlg-head h2 { margin:0; font-size:var(--fs-h); font-weight:600; }
  .dlg-head .icon-btn { margin-left:auto; width:28px; height:28px; }
  .dlg-body { padding:16px; overflow:auto; min-height:0; flex:1 1 auto; }
  .dlg-foot { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; padding:10px 16px; min-height:56px;
              border-top:1px solid var(--line); background:var(--surface-2); flex:none; }
  .dlg-foot .grow { flex:1 1 auto; }
  .sec-h { font-size:12px; color:var(--ink-3); margin:0 0 8px; font-weight:normal; }
  .kbd-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
  .kbd-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line);
              font-size:var(--fs-body); }
  .kbd-item > span { color:var(--ink-2); }
  .kbd-item .ks { display:flex; gap:3px; flex:none; }
  .kgroup + .kgroup { margin-top:14px; }
  .syn { display:flex; flex-direction:column; gap:1px; }
  .syn button { display:flex; gap:12px; align-items:baseline; padding:7px 8px; border-radius:var(--r-sm); text-align:left; }
  .syn button:hover { background:var(--accent-soft); }
  .syn code { color:var(--accent-ink); background:var(--accent-soft); padding:2px 6px; border-radius:5px; white-space:nowrap; min-width:132px; }
  .syn span { font-size:var(--fs-label); color:var(--ink-2); }

  .set-grid { display:grid; grid-template-columns:168px minmax(0,1fr); min-height:0; flex:1 1 auto; overflow:hidden; }
  .set-nav { padding:10px 8px; border-right:1px solid var(--line); background:var(--surface-2); display:flex; flex-direction:column; gap:2px; }
  .set-nav button { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:var(--r-sm); font-size:var(--fs-body); color:var(--ink-2); }
  .set-nav button:hover { background:var(--surface-3); color:var(--ink); }
  .set-nav button[aria-selected="true"] { background:var(--accent-soft); color:var(--accent-ink); font-weight:500; }
  .set-pane { padding:16px; overflow:auto; min-height:0; }
  .set-pane[hidden] { display:none; }
  .set-pane h3 { margin:0 0 6px; font-size:13.5px; font-weight:600; }
  .set-pane h3:not(:first-child) { margin-top:16px; }
  .set-pane p { margin:0 0 10px; font-size:var(--fs-label); color:var(--ink-2); line-height:1.6; }
  .items { list-style:none; margin:0 0 8px; padding:0; border:1px solid var(--line); border-radius:var(--r); max-height:180px; overflow:auto; }
  .items li { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:6px 6px 6px 10px; border-bottom:1px solid var(--line);
              font-size:var(--fs-body); }
  .items li:last-child { border-bottom:0; }
  .items li span { min-width:0; overflow-wrap:anywhere; }
  .items:empty { display:none; }
  .sbtn { height:30px; padding:0 10px; border:1px solid var(--line-2); border-radius:var(--r-sm); background:var(--surface);
          font-size:var(--fs-label); color:var(--ink); flex:none; }
  .sbtn:hover { background:var(--surface-3); }
  .sbtn.primary { background:var(--accent-solid); border-color:var(--accent-solid); color:var(--on-accent); }
  .items li .sbtn { height:26px; }
  .fieldline { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0 0; }
  .fieldline input[type=text], .fieldline select { flex:1 1 160px; min-width:0; height:30px; padding:0 8px; border:1px solid var(--line-2);
                  border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font:var(--fs-label) var(--font); }
  .check { display:flex; align-items:flex-start; gap:9px; padding:7px 0; font-size:var(--fs-body); cursor:pointer; }
  .check input { margin:2px 0 0; width:15px; height:15px; accent-color:var(--accent); flex:none; }
  #setMsg { margin:0; padding:8px 16px 0; white-space:pre-line; font-size:var(--fs-label); flex:none; }
  #setMsg:empty { display:none; }
  #setMsg.ok { color:var(--ok); } #setMsg.warn { color:var(--warn); } #setMsg.bad { color:var(--bad); } #setMsg.info { color:var(--info); }
  .syn-ro { margin:0; padding:0; list-style:none; font-size:var(--fs-label); color:var(--ink-2); }
  .syn-ro li { display:flex; gap:12px; padding:4px 0; }
  .syn-ro code { min-width:120px; color:var(--accent-ink); }

  /* upgrade (inside the settings) */
  #upgrade { display:none; }
  #upgrade.open { display:block; }
  #upgrade .hint { color:var(--ink-2); font-size:var(--fs-label); margin:0; }
  .drop { display:block; white-space:normal; border:2px dashed var(--line-2); border-radius:var(--r); padding:16px 12px; text-align:center;
          cursor:pointer; color:var(--ink-2); margin:8px 0; font-size:var(--fs-body); }
  .drop.over { border-color:var(--accent); color:var(--ink); }
  .drop strong { color:var(--accent-ink); }
  #upgrade .row2 { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .ustatus { margin:8px 0; min-height:1.6em; font-size:var(--fs-label); }
  .ustatus.ok { color:var(--ok); } .ustatus.warn { color:var(--warn); } .ustatus.bad { color:var(--bad); } .ustatus.info { color:var(--ink-2); }
  .ureport h3 { font-size:var(--fs-body); margin:12px 0 4px; }
  .ureport ul { margin:0; padding-left:1.4em; max-height:14em; overflow:auto; overflow-wrap:anywhere; font-size:var(--fs-label); }
  .ureport .ver { font-size:var(--fs-h); font-weight:600; }
  .ureport .warnbox { color:var(--warn); border:1px solid var(--warn); border-radius:var(--r-sm); padding:6px 10px; margin:8px 0; }

  /* ---- folded: the search box alone ---- */
  .shell.folded { height:90px; }
  .shell.folded .titlebar, .shell.folded .filterbar, .shell.folded .stage, .shell.folded .statusbar { display:none; }
  .shell.folded .searchbar { flex:1; }
  .shell.folded .fold-state { display:block; }

  /* ---- narrow windows ---- */
  @media (max-width:1080px) {
    .stage { grid-template-columns:minmax(0,1fr); }
    .preview { display:none; }
  }
  @media (max-width:860px) {
    .st-hints { display:none; }
    .st-right { margin-left:auto; }
  }
  @media (max-width:760px) {
    .row .tm { display:none; }
    .row { grid-template-columns:20px minmax(0,1fr) auto; }
    .kbd-hint { display:none; }
    .st-rule { display:none; }
    .set-grid { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
    .set-nav { flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); }
    .set-nav button { width:auto; white-space:nowrap; }
    .kbd-grid { grid-template-columns:1fr; gap:14px; }
  }
  @media (max-width:560px) {
    .tb-ver, #themeBtn, #helpBtn { display:none; }
    .searchbar { padding-left:10px; padding-right:10px; gap:6px; }
  }
</style>
</head>

  if (opts.reuse && sid) p.set('sid', sid);

  searchCtl = typeof AbortController === 'function' ? new AbortController() : null;
  return api('/api/search?' + p, searchCtl ? {signal: searchCtl.signal} : {}).then(j => {

    searched = q;

    renderFilters(); renderEmpty();

// large results are grouped in the background: fetch the loaded rows again once the marks are ready
function refreshMarks(my, tries) {

    const p = new URLSearchParams({page: PAGE, sid: sid, offset: 0, limit: Math.min(rows.length, 500)});
    api('/api/rows?' + p).then(j => {

      versions = j.versions;

  }, 400);
}

// row k of the view loaded (fetching pages as needed), then selected; raw: a row number of the whole result
function jumpTo(raw, k) {
  if (raw !== null && raw !== undefined) {
    const i = rows.findIndex(r => r.k === raw);
    if (i >= 0) { select(i); return; }
    if (type !== 'all' || scope) {        // the newest version is filtered out: show every row first
      type = 'all'; scope = '';
      search({reuse: true}).then(() => jumpTo(null, raw));
      return;
    }
    k = raw;
  }
  if (k < rows.length) { select(k); return; }
  if (!sid || k >= count) return;
  if (loadingMore) { setTimeout(() => jumpTo(null, k), 100); return; }
  loadingMore = true;
  const my = seq;
  let again = false;
  const p = new URLSearchParams({page: PAGE, sid: sid, offset: rows.length, limit: Math.min(500, k - rows.length + 1)});
  api('/api/rows?' + p).then(j => {
    if (my !== seq) return;
    appendRows(j.rows);
    again = j.rows.length > 0;
  }).catch(e => { if (e.status === 409) search({keep: true}); })
    .finally(() => { loadingMore = false; if (again) jumpTo(null, k); });
}
function loadMore() {
  if (loadingMore || !sid || rows.length >= count) return;
  loadingMore = true;
  const my = seq;
  const p = new URLSearchParams({page: PAGE, sid: sid, offset: rows.length, limit: PAGE_ROWS});
  api('/api/rows?' + p).then(j => { if (my === seq) appendRows(j.rows); })
    .catch(e => { if (e.status === 409) search({keep: true}); }).finally(() => { loadingMore = false; });
}
let scrollQueued = false;
$('listwrap').addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => {
    scrollQueued = false;
    const box = $('listwrap');
    if (box.scrollTop + box.clientHeight >= box.scrollHeight - 20 * ROW_H) loadMore();
  });
}, {passive: true});

// ---------------------------------------------------------------- actions
function target() {
  if (cur < 0 && rows.length) select(0);
  return cur >= 0 ? rows[cur] : null;
}
function openCurrent(folder) {
  const r = target();
  if (!r || !sid) return;
  post(folder ? '/api/open_folder' : '/api/open', {page: PAGE, sid: sid, k: r.k})
    .then(j => {
      if (folder && j.selected === false) toast(L.locatedFolder);
      else toast(folder ? tr('toast_located') : tr('toast_opened', {name: r.name}));
    })
    .catch(e => setStatus(L.open_failed(e.message), 'bad'));
}
function copyCurrent() {
  const r = target();
  if (!r) return;
  const text = r.path;
  const back = document.activeElement;
  const ok = () => toast(tr('toast_copied_path', {path: text.length > 60 ? '…' + text.slice(-58) : text}));
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove();
    if (back && back.focus) back.focus();
    if (done) ok(); else setStatus(L.copy_failed, 'bad');
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}
function rescan() {
  if (!alive) return;
  $('rescan').disabled = true;
  post('/api/rescan').then(j => {
    toast(j.started ? tr('toast_rescan_started') : tr('toast_rescan_busy'));
    clearTimeout(statusTimer); statusTimer = setTimeout(pollStatus, 300);
  }).catch(e => { setStatus(e.message, 'bad'); if (alive) $('rescan').disabled = false; });
}
function clearSearch() {
  $('q').value = '';
  searchNow();
  $('q').focus();
}

// ---------------------------------------------------------------- folding
function setFolded(on) {
  $('shell').classList.toggle('folded', on);
  $('q').placeholder = on ? L.placeholderShort : L.placeholder;
}

// ---------------------------------------------------------------- keyboard
let timer = null, composing = false;
$('q').addEventListener('compositionstart', () => { composing = true; });
$('q').addEventListener('compositionend', () => { composing = false; clearTimeout(timer); timer = setTimeout(search, 120); });
$('q').addEventListener('input', () => {
  syncField();
  if (composing) return;
  clearTimeout(timer); timer = setTimeout(search, 120);
});
$('clear').addEventListener('click', clearSearch);
function listKeys(ev, inBox) {
  const q = $('q');
  const atStart = q.selectionStart === 0 && q.selectionEnd === 0;
  const atEnd = q.selectionStart === q.value.length && q.selectionEnd === q.value.length;
  const page = 8;
  switch (ev.key) {
    case 'ArrowDown': move(1); return true;
    case 'ArrowUp': if (!inBox && cur <= 0) { q.focus(); return true; } move(-1); return true;
    case 'PageDown': move(page); return true;
    case 'PageUp': move(-page); return true;
    case 'Home': if (inBox && !atStart) return false; select(0); return true;
    case 'End': if (inBox && !atEnd) return false; select(rows.length - 1); return true;
    default: return false;
  }
}
$('q').addEventListener('keydown', ev => {
  if (ev.isComposing || composing) return;
  const nav = ['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp'].includes(ev.key);
  if (nav && !ev.ctrlKey && !ev.altKey && !ev.metaKey && q.value.trim() && q.value !== searched) {
    ev.preventDefault();                  // typed faster than the search delay: search first, then move
    const key = ev.key;
    syncSearch().then(() => listKeys({key: key}, true));
    return;
  }
  if (!ev.ctrlKey && !ev.altKey && !ev.metaKey && rows.length && listKeys(ev, true)) { ev.preventDefault(); return; }
  if (ev.key === 'Enter') { ev.preventDefault(); syncSearch().then(() => openCurrent(ev.ctrlKey)); }
  else if (ev.key === 'Escape') { if (q.value) { ev.preventDefault(); clearSearch(); } }
  else if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === 'C' || ev.key === 'c')) { ev.preventDefault(); copyCurrent(); }
  else if ((ev.key === 'ContextMenu' || (ev.shiftKey && ev.key === 'F10')) && cur >= 0) { ev.preventDefault(); menuAtRow(); }
});
$('rows').addEventListener('keydown', ev => {
  if (listKeys(ev, false)) { ev.preventDefault(); return; }
  if (ev.key === 'Enter') { ev.preventDefault(); openCurrent(ev.ctrlKey); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === 'C' || ev.key === 'c')) { ev.preventDefault(); copyCurrent(); }
  else if (ev.key === 'Escape') { ev.preventDefault(); q.focus(); }
  else if (ev.key === 'ContextMenu' || (ev.shiftKey && ev.key === 'F10')) { ev.preventDefault(); menuAtRow(); }
  else if (ev.key.length === 1 && !ev.ctrlKey && !ev.altKey && !ev.metaKey && ev.key !== '?') {
    ev.preventDefault();
    q.focus();
    q.value += ev.key;
    q.setSelectionRange(q.value.length, q.value.length);
    q.dispatchEvent(new Event('input'));
  }
});
function anyDialog() { return ['settings', 'keysDlg', 'about'].some(id => $(id).open); }
document.addEventListener('keydown', ev => {
  if (!alive || ev.isComposing) return;
  if (ev.key === 'F5') { ev.preventDefault(); if (!anyDialog()) rescan(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === ',') { ev.preventDefault(); if (!anyDialog()) openSettings(); return; }
  const typing = ev.target.closest && ev.target.closest('input, textarea, select');
  if (ev.key === '?' && !anyDialog() && (!typing || (ev.target === q && !q.value))) {
    ev.preventDefault(); openKeys(ev.target === q ? q : null);
  }
});

// ---------------------------------------------------------------- mouse
function rowIndex(ev) {
  const row = ev.target.closest('.row');
  return row ? Array.prototype.indexOf.call($('rows').children, row) : -1;
}
$('rows').addEventListener('mousedown', ev => {
  const i = rowIndex(ev);
  if (i < 0) return;
  if (ev.detail > 1) ev.preventDefault();        // no text selection on double-click
  select(i, false);
});
$('rows').addEventListener('dblclick', ev => { if (rowIndex(ev) >= 0) openCurrent(false); });
$('rows').addEventListener('contextmenu', ev => {
  const i = rowIndex(ev);
  if (i < 0) return;
  ev.preventDefault();
  select(i, false);
  if (ev.clientX || ev.clientY) openRowMenu(ev.clientX, ev.clientY);
  else menuAtRow();
});
$('open').addEventListener('click', () => openCurrent(false));
$('folder').addEventListener('click', () => openCurrent(true));
$('copy').addEventListener('click', copyCurrent);
$('pvCopy').addEventListener('click', copyCurrent);
$('quit').addEventListener('click', () => { post('/api/quit').catch(() => {}).finally(serviceGone); });
$('themeBtn').addEventListener('click', toggleTheme);
$('helpBtn').addEventListener('click', () => openKeys($('helpBtn')));
$('gear').addEventListener('click', () => openSettings());

// ---------------------------------------------------------------- menus
let menuReturn = null;
function closeMenus() {
  ['ctx', 'sortMenu', 'moreMenu'].forEach(id => { $(id).hidden = true; });
  ['moreBtn', 'sortBtn'].forEach(id => $(id).setAttribute('aria-expanded', 'false'));
}
function menuItems(m) { return Array.from(m.querySelectorAll('button')).filter(b => !b.hidden && !b.disabled); }
function showMenu(m, x, y, from) {
  closeMenus();
  menuReturn = from || q;
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(4, Math.min(x, window.innerWidth - w - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(y, window.innerHeight - h - 4)) + 'px';
  const items = menuItems(m);
  const on = items.find(b => b.getAttribute('aria-checked') === 'true');
  (on || items[0] || m).focus();
}
function openRowMenu(x, y) {
  const r = cur >= 0 ? rows[cur] : null;
  if (!r || !alive) return;
  $('mJump').hidden = r.ver !== 'older';
  $('mExclude').querySelector('.ml').textContent = r.folder ? L.excludeThis : L.excludeParent;
  $('mExclude').disabled = !r.can_exclude;
  $('mExclude').title = r.can_exclude ? '' : L.cannotExclude;
  $('mRescan').disabled = !lastStatus || lastStatus.state !== 'ready';
  showMenu($('ctx'), x, y, q);
}
function menuAtRow() {
  const row = $('rows').children[cur];
  if (row) { const b = row.getBoundingClientRect(); openRowMenu(b.left + 24, b.bottom); }
}
function anchorBelow(btn, m) {
  const b = btn.getBoundingClientRect();
  m.hidden = false;
  const x = b.right - m.offsetWidth;
  m.hidden = true;
  showMenu(m, x, b.bottom + 4, btn);
  btn.setAttribute('aria-expanded', 'true');
}
$('moreBtn').addEventListener('click', () => {
  if (!$('moreMenu').hidden) { closeMenus(); return; }
  $('mFold').querySelector('.ml').textContent = $('shell').classList.contains('folded') ? L.unfold : tr('more_fold');
  anchorBelow($('moreBtn'), $('moreMenu'));
});
$('sortBtn').addEventListener('click', () => {
  if (!$('sortMenu').hidden) { closeMenus(); return; }
  const m = $('sortMenu');
  m.textContent = '';
  tr('sorts').forEach((label, i) => {
    const b = el('button');
    b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.dataset.i = i;
    const on = SORTS[i][0] === sort && SORTS[i][1] === desc;
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    const mi = el('span', 'mi');
    if (on) mi.appendChild(icon('i-check', 14));
    b.append(mi, el('span', 'ml', label));
    m.appendChild(b);
  });
  anchorBelow($('sortBtn'), m);
});
function menuKeys(ev) {
  const m = ev.currentTarget, items = menuItems(m), i = items.indexOf(document.activeElement);
  if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (ev.key === 'Home') { ev.preventDefault(); items[0].focus(); }
  else if (ev.key === 'End') { ev.preventDefault(); items[items.length - 1].focus(); }
  else if (ev.key === 'Escape' || ev.key === 'Tab') { ev.preventDefault(); closeMenus(); q.focus(); }
}
['ctx', 'sortMenu', 'moreMenu'].forEach(id => $(id).addEventListener('keydown', menuKeys));
function excludeCurrent() {
  const r = cur >= 0 ? rows[cur] : null;
  if (!r || !sid || !r.can_exclude) return;
  const target_ = r.folder ? r.path : r.dir;
  if (!window.confirm(L.excludeQ(target_))) return;
  post('/api/exclude', {page: PAGE, sid: sid, k: r.k}).then(j => { toast(tr('toast_excluded', {dir: j.excluded})); startApply(); })
    .catch(e => setStatus(L.saveFailed(e.message), 'bad'));
}
$('ctx').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.disabled) return;
  closeMenus();
  q.focus();
  if (b.id === 'mOpen') openCurrent(false);
  else if (b.id === 'mFolder') openCurrent(true);
  else if (b.id === 'mCopy') copyCurrent();
  else if (b.id === 'mExclude') excludeCurrent();
  else if (b.id === 'mJump') jumpTo(rows[cur].ver_newest);
  else if (b.id === 'mRescan') rescan();
});
$('sortMenu').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  closeMenus();
  [sort, desc] = SORTS[Number(b.dataset.i)];
  try { localStorage.setItem(SORT_KEY, JSON.stringify([sort, desc])); } catch (e) { /* not kept */ }
  renderSortButton();
  $('sortBtn').focus();
  search({keep: true});
});
$('moreMenu').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.disabled) return;
  closeMenus();
  if (b.id === 'mKeys') openKeys($('moreBtn'));
  else if (b.id === 'mTheme') { toggleTheme(); q.focus(); }
  else if (b.id === 'mSettings') openSettings();
  else if (b.id === 'mFold') { setFolded(!$('shell').classList.contains('folded')); q.focus(); }
  else if (b.id === 'rescan') { rescan(); q.focus(); }
  else if (b.id === 'up-open') openSettings('Upgrade');
  else if (b.id === 'mAbout') openDialog($('about'), $('moreBtn'));
});
document.addEventListener('mousedown', ev => { if (!ev.target.closest('.menu, #moreBtn, #sortBtn')) closeMenus(); });
window.addEventListener('blur', closeMenus);
window.addEventListener('resize', closeMenus);

// ---------------------------------------------------------------- dialogs
function openDialog(d, from) {
  if (!alive) return;
  closeMenus();
  d.returnTo = from || document.activeElement || q;
  if (!d.open) d.showModal();
}
['keysDlg', 'about', 'settings'].forEach(id => {
  $(id).addEventListener('close', () => {
    const back = $(id).returnTo;
    if (alive) ((back && document.body.contains(back) && back.offsetParent !== null) ? back : q).focus();
  });
});
function openKeys(from) {
  openDialog($('keysDlg'), from);
  const first = $('synList').querySelector('button');
  if (first) first.focus();
}
$('keysClose').addEventListener('click', () => $('keysDlg').close());
$('aboutClose').addEventListener('click', () => $('about').close());
$('setClose').addEventListener('click', () => $('settings').close());
$('synList').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  $('keysDlg').returnTo = q;
  $('keysDlg').close();
  q.value = b.dataset.q;
  searchNow();
});

// ---------------------------------------------------------------- settings
let setData = null, setRootsList = [], setExcludeList = [];
const PANES = ['Roots', 'Exclude', 'Search', 'Upgrade'];
function setMsg(text, kind) { const m = $('setMsg'); m.className = kind || ''; m.textContent = text; }
function showPane(name, focus) {
  PANES.forEach(p => {
    const on = p === name;
    $('tab' + p).setAttribute('aria-selected', on ? 'true' : 'false');
    $('tab' + p).tabIndex = on ? 0 : -1;
    $('pane' + p).hidden = !on;
  });
  if (focus) $('tab' + name).focus();
  if (name === 'Upgrade') upStatus().catch(err => upSay('bad', L.up.infoFailed(upWhy(err))));
  $('setDefaults').hidden = name === 'Upgrade';
}
$('setNav').addEventListener('click', ev => { const b = ev.target.closest('[role=tab]'); if (b) showPane(b.id.slice(3)); });
$('setNav').addEventListener('keydown', ev => {
  const i = PANES.findIndex(p => $('tab' + p) === document.activeElement);
  if (i < 0) return;
  const step = {ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1}[ev.key];
  if (step) { ev.preventDefault(); showPane(PANES[(i + step + PANES.length) % PANES.length], true); }
  else if (ev.key === 'Home') { ev.preventDefault(); showPane(PANES[0], true); }
  else if (ev.key === 'End') { ev.preventDefault(); showPane(PANES[PANES.length - 1], true); }
});
function renderItems(id, list) {
  const ul = $(id);
  ul.textContent = '';
  list.forEach((item, i) => {
    const li = el('li');
    const b = el('button', 'sbtn', L.remove); b.type = 'button';
    b.setAttribute('aria-label', L.removeItem(item));
    b.addEventListener('click', () => { list.splice(i, 1); renderSettings(); setMsg(''); });
    li.append(el('span', '', item), b);
    ul.appendChild(li);
  });
}
function renderSettings() {
  renderItems('setRoots', setRootsList);
  renderItems('setExclude', setExcludeList);
  $('setAnyway').hidden = true;
}
function addTo(list, item) {
  item = (item || '').trim();
  if (item && !list.includes(item)) list.push(item);
  renderSettings(); setMsg('');
}
function usePicker(can) {
  $('addRoot').hidden = !can; $('addExcludeFolder').hidden = !can;
  $('rootPath').hidden = can; $('addRootPath').hidden = can;
}
function openSettings(pane) {
  if (!alive) return;
  const from = document.activeElement;
  closeMenus();
  api('/api/settings').then(j => {
    setData = j;
    setRootsList = j.roots.slice(); setExcludeList = j.exclude.slice();
    $('setHidden').checked = j.hidden;
    $('setMatchPath').checked = j.match_path !== false;
    $('setSort').value = String(Math.max(0, SORTS.findIndex(x => x[0] === sort && x[1] === desc)));
    usePicker(j.can_pick);
    renderSettings(); setMsg('');
    openDialog($('settings'), from && from !== document.body ? from : q);
    showPane(typeof pane === 'string' ? pane : 'Roots', true);
  }).catch(e => setStatus(L.saveFailed(e.message), 'bad'));
}
function pick(list, button) {
  button.disabled = true;
  setMsg(L.picking, 'info');
  post('/api/pick_folder', {}).then(j => {
    if (!j.available) { usePicker(false); setMsg(L.noPicker, 'warn'); return; }
    setMsg('');
    if (j.path) addTo(list, j.path);
  }).catch(e => setMsg(L.saveFailed(e.message), 'bad')).finally(() => { button.disabled = false; });
}
function saveSettings(force) {
  ['setSave', 'setAnyway'].forEach(id => { $(id).disabled = true; });
  const mp = $('setMatchPath').checked;
  const newSort = SORTS[Number($('setSort').value)] || SORTS[0];
  post('/api/settings', {roots: setRootsList, exclude: setExcludeList, hidden: $('setHidden').checked,
                         match_path: mp, force: !!force})
    .then(j => {
      if (j.saved) {
        $('settings').close();
        if (mp !== matchPath) { matchPath = mp; renderKeys(); }
        [sort, desc] = newSort;
        try { localStorage.setItem(SORT_KEY, JSON.stringify(newSort)); } catch (e) { /* not kept */ }
        renderSortButton();
        if (j.rescan) startApply(); else search({keep: true});
        return;
      }
      if (j.blocked) { setMsg(L.setBlocked(j.problems[0]), 'bad'); $('setAnyway').hidden = true; return; }
      setMsg([L.setWarn].concat(j.problems.map(p => '· ' + p)).join('\n'), 'warn');
      $('setAnyway').hidden = false;
    })
    .catch(e => setMsg(L.saveFailed(e.message), 'bad'))
    .finally(() => { ['setSave', 'setAnyway'].forEach(id => { $(id).disabled = false; }); });
}
function startApply() {
  waitApply = true;
  setStatus(L.applying, 'info', true);
  clearTimeout(statusTimer); statusTimer = setTimeout(pollStatus, 300);
}
$('addRoot').addEventListener('click', () => pick(setRootsList, $('addRoot')));
$('addExcludeFolder').addEventListener('click', () => pick(setExcludeList, $('addExcludeFolder')));
$('addRootPath').addEventListener('click', () => { addTo(setRootsList, $('rootPath').value); $('rootPath').value = ''; });
$('rootPath').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); $('addRootPath').click(); } });
$('addRule').addEventListener('click', () => { addTo(setExcludeList, $('ruleIn').value); $('ruleIn').value = ''; });
$('ruleIn').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); $('addRule').click(); } });
$('setDefaults').addEventListener('click', () => {
  if (!setData) return;
  setRootsList = setData.defaults.roots.slice(); setExcludeList = setData.defaults.exclude.slice();
  $('setHidden').checked = setData.defaults.hidden;
  $('setMatchPath').checked = setData.defaults.match_path !== false;
  $('setSort').value = '0';
  renderSettings(); setMsg('');
});
['setMatchPath', 'setHidden'].forEach(id => $(id).addEventListener('change', () => { $('setAnyway').hidden = true; setMsg(''); }));
$('setCancel').addEventListener('click', () => $('settings').close());
$('setSave').addEventListener('click', () => saveSettings(false));
$('setAnyway').addEventListener('click', () => saveSettings(true));
$('settings').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey) && $('paneUpgrade').hidden) { ev.preventDefault(); saveSettings(false); }
});

// ---------------------------------------------------------------- start
(function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) { /* none */ }
  if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  setTheme(theme, false);
})();
api('/api/status').then(st => {
  if (st.notice) pendingNotice = st.notice;
  if (typeof st.match_path === 'boolean') matchPath = st.match_path;
  applyLanguage(st.lang); showIndex(st);
  if (pendingNotice) { setStatus(pendingNotice.text, pendingNotice.kind, true); pendingNotice = null; }
  search(); pollStatus();
}).catch(() => { applyLanguage('zh'); search(); pollStatus(); });
</script>
