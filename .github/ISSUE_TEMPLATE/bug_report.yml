name: Bug report
description: A search, the index, the window or the page did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never attach real file lists, personal data or private paths; describe them, or give a small fictional folder layout that shows the problem.
        Security problems go through the Security tab ("Report a vulnerability"), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you use, or the VERSION file
      placeholder: "0.1.0"
  - type: input
    id: command
    attributes:
      label: What you did in the window, the page or the command line
      placeholder: "searched for report !draft ext:pdf"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version, distribution, desktop and whether python3-gi is installed
      placeholder: "Python 3.10, Ubuntu 22.04 GNOME, python3-gi 3.42"
