name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python the scripts support, and a current one
        python: ["3.8", "3.12"]
    runs-on: ubuntu-22.04
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository checks
        run: python scripts/check_repo.py
      - name: shellcheck
        run: shellcheck -S warning .githooks/* .claude/hooks/session-start.sh $(ls install.sh 2>/dev/null)
  gtk:
    # The GTK window with the distribution's own python3-gi, under a virtual display.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: GTK 3 and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 xvfb
      - name: GTK window tests
        run: xvfb-run -a /usr/bin/python3 -m unittest tests.test_gtk -v
  web:
    # The browser page with Playwright and Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Page tests
        run: |
          node tests/web.test.js
          node tests/upgrade.test.js
  tool-upgrade:
    # tool_upgrade.py must be the master copy (walkwithedi/edi-lab, .github/upgrade/tool_upgrade.py) at the
    # version in TOOL_UPGRADE_VERSION. The master repository is private: the job reads it with the
    # EDI_LAB_READ_TOKEN secret (read access to its contents) and only notes that it was skipped without it.
    # scripts/check_repo.py checks the copy against the pinned SHA-256 in every run either way.
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.EDI_LAB_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Master copy
        if: env.TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: walkwithedi/edi-lab
          token: ${{ secrets.EDI_LAB_READ_TOKEN }}
          path: _master
          fetch-depth: 0
          sparse-checkout: .github/upgrade
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare the copy
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::EDI_LAB_READ_TOKEN is not set: compared with the pinned SHA-256 only"
            python scripts/check_tool_upgrade.py
          else
            python scripts/check_tool_upgrade.py _master
          fi
  bench:
    # Speed and memory on a synthetic index of a million entries (scripts/bench.py). Reported
    # in the job summary; the limits are checked by hand when a pull request changes the core.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Benchmark
        run: |
          python scripts/bench.py | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  scan:
    # The scanner prints only file:line and the rule under GitHub Actions, and gitleaks runs
    # with --redact, so a finding is never repeated in a log.
    runs-on: ubuntu-latest
    env:
      SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sensitive data (whole tree, file names and metadata)
        run: python scripts/sensitive_scan.py
      - name: Sensitive data (new commits - lines, messages, identities, images)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.event.after) }}
        run: |
          if ! git merge-base "${RANGE%%..*}" "${RANGE##*..}" >/dev/null 2>&1; then
            echo "no common ancestor in $RANGE (history rewritten): range scan skipped"; exit 0
          fi
          python scripts/sensitive_scan.py --range "$RANGE"
      - name: Credentials (gitleaks, all of history)
        run: |
          go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .
