name: release
# Publishes the version in VERSION:
#   push to main       releases v<version> if that release does not exist yet, so merging a
#                      version change is all a release takes (other pushes to main are skipped)
#   workflow_dispatch  the same check, run by hand
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide
        id: decide
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          run=true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do"
            run=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Check
        if: steps.decide.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests
          python scripts/check_repo.py
          python scripts/sensitive_scan.py
      - name: Build
        if: steps.decide.outputs.run == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          mkdir -p dist
          # the tool only: programs, page, launchers, docs and licence
          git archive --format=zip --prefix=find-fast/ -o "dist/find-fast-${TAG}.zip" HEAD \
            find_fast.py find_fast_core.py find_fast_gtk.py find_fast_web.py find_fast.html 双击运行.desktop install.sh \
            README.md README.zh-CN.md LICENSE CHANGELOG.md VERSION
      - name: Publish
        if: steps.decide.outputs.run == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          awk "/^## ${TAG#v}\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          gh release create "$TAG" dist/*.zip --target "${GITHUB_SHA}" --title "$TAG" --notes-file notes.md
